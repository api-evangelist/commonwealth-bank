  - aid: commonwealth-bank:cba-cds-banking-standard-api
    name: Commonwealth Bank CDR Banking API (DSB Consumer Data Standards)
    tags:
      - CDR
      - Open Banking
      - Consumer Data Standards
      - Banking
      - Standards
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.commbank.com.au/banking/open-banking.html
    baseURL: https://api.commbank.com.au/public/cds-au/v1/banking
    properties:
      - url: https://consumerdatastandardsaustralia.github.io/standards/
        type: APIReference
      - url: openapi/commonwealth-bank-cds-banking-openapi.json
        type: OpenAPI
      - url: https://www.commbank.com.au/banking/open-banking.html
        type: Documentation
    description: >-
      The complete, shared DSB Consumer Data Standards CDR Banking API v1.36.0
      that every Australian ADI (including Commonwealth Bank) is legally required
      to implement. This is the standardized reference contract, NOT a
      bank-proprietary spec: all 16 endpoints across products (public), accounts,
      balances, transactions, direct debits, scheduled payments, payees, and
      common customer. Harvested verbatim from the Data Standards Body
      (consumerdatastandardsaustralia.github.io / ConsumerDataStandardsAustralia
      standards repo, cds_banking swagger). Provided as the canonical standard
      alongside CommBank's own per-family first-party specs.

  - aid: commonwealth-bank:cba-fast-payment-credit-transfer-api
    name: Commonwealth Bank Fast Payment (Credit Transfer Initiation) API
    tags:
      - Payments
      - NPP
      - Real-Time Payments
      - Credit Transfer
      - Business
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.api.commbank.com.au/apis
    properties:
      - url: https://developer.api.commbank.com.au/apis
        type: Documentation
      - url: https://developer.api.commbank.com.au/terms-of-use
        type: TermsOfService
    description: >-
      Documented in CommBank's business API catalogue as the Credit Transfer
      Initiation / Fast Payment API: a near real-time capability that lets a
      business send money to most Australian financial institutions through the
      New Payments Platform (NPP). REST-based with OAuth 2.0 security. The full
      OpenAPI specification is not published as a public download — access to the
      catalogue and specs is granted at CommBank's discretion behind developer
      registration (partner-gated), so no spec is wired here to avoid fabrication.

  - aid: commonwealth-bank:cba-namecheck-api
    name: Commonwealth Bank NameCheck API
    tags:
      - Payments
      - Fraud Prevention
      - Confirmation of Payee
      - Security
      - Business
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://developer.api.commbank.com.au/apis/namecheck
    properties:
      - url: https://developer.api.commbank.com.au/apis/namecheck
        type: Documentation
      - url: https://developer.api.commbank.com.au/terms-of-use
        type: TermsOfService
    description: >-
      Documented in CommBank's business API catalogue: NameCheck is a security
      tool that helps organisations and their customers avoid false billing scams
      and mistaken payments by checking payee account name/number combinations
      before a payment is made. REST-based with OAuth 2.0 security. The OpenAPI
      specification is not published as a public download (catalogue access is
      granted at CommBank's discretion behind developer registration), so no spec
      is wired here to avoid fabrication.

