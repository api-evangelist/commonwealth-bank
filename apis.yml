apis:
  - aid: commonwealth-bank:cba-cdr-product-reference-data-api
    name: Commonwealth Bank CDR Product Reference Data API
    tags:
      - CDR
      - Open Banking
      - Product Reference Data
      - Banking
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.commbank.com.au/developer/documentation/Products
    baseURL: https://api.commbank.com.au/public/cds-au/v1/banking/products
    properties:
      - url: https://www.commbank.com.au/developer/documentation/Products
        type: Documentation
      - url: https://consumerdatastandardsaustralia.github.io/standards/
        type: APIReference
      - url: openapi/commonwealth-bank-cdr-products-openapi.json
        type: OpenAPI
      - url: https://www.commbank.com.au/banking/open-banking.html
        type: Standards
    description: >-
      PUBLIC, unauthenticated Product Reference Data (PRD) surface exposing
      CommBank's banking product catalogue (rates, fees, features, eligibility)
      under Australia's Consumer Data Right. Covers the DSB Get Products
      (/banking/products) and Get Product Detail (/banking/products/{productId})
      contract, served at the confirmed live CommBank CDR public base URI
      api.commbank.com.au/public (verified against the CDR Register Get Data
      Holder Brands Summary API; calls without a supported x-v header return
      HTTP 406). Wired to CommBank's own first-party Swagger 2.0 spec harvested
      verbatim from the developer portal.

  - aid: commonwealth-bank:cba-cdr-accounts-balances-api
    name: Commonwealth Bank CDR Accounts & Balances API
    tags:
      - CDR
      - Open Banking
      - Accounts
      - Balances
      - Banking
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.commbank.com.au/developer/documentation/Accounts
    baseURL: https://secure.api.commbank.com.au/api/cds-au/v1/banking/accounts
    properties:
      - url: https://www.commbank.com.au/developer/documentation/Accounts
        type: Documentation
      - url: https://www.commbank.com.au/developer/documentation/Balances
        type: Documentation
      - url: https://consumerdatastandardsaustralia.github.io/standards/
        type: APIReference
      - url: openapi/commonwealth-bank-cdr-accounts-openapi.json
        type: OpenAPI
      - url: openapi/commonwealth-bank-cdr-balances-openapi.json
        type: OpenAPI
    description: >-
      Consumer-AUTHORIZED CDR surface covering the DSB Get Accounts, Get Account
      Detail, Get Bulk Balances and Get Account Balance contracts
      (/banking/accounts, /banking/accounts/{accountId},
      /banking/accounts/balances, /banking/accounts/{accountId}/balance). Access
      is available only to Accredited Data Recipients acting on explicit customer
      consent via the CDR ADR model over the authenticated host
      secure.api.commbank.com.au. Wired to CommBank's first-party Accounts and
      Balances Swagger 2.0 specs harvested verbatim from the developer portal.

  - aid: commonwealth-bank:cba-cdr-transactions-api
    name: Commonwealth Bank CDR Transactions API
    tags:
      - CDR
      - Open Banking
      - Transactions
      - Banking
      - Australia
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.commbank.com.au/developer/documentation/Transactions
    baseURL: https://secure.api.commbank.com.au/api/cds-au/v1/banking/accounts/{accountId}/transactions
    properties:
      - url: https://www.commbank.com.au/developer/documentation/Transactions
        type: Documentation
      - url: https://consumerdatastandardsaustralia.github.io/standards/
        type: APIReference
      - url: openapi/commonwealth-bank-cdr-transactions-openapi.json
        type: OpenAPI
    description: >-
      Consumer-AUTHORIZED CDR surface covering the DSB Get Transactions For
      Account and Get Transaction Detail contracts
      (/banking/accounts/{accountId}/transactions and
      /banking/accounts/{accountId}/transactions/{transactionId}). Available to
      Accredited Data Recipients with explicit customer consent over the
      authenticated host secure.api.commbank.com.au. Wired to CommBank's
      first-party Transaction Details Swagger 2.0 spec harvested verbatim from
      the developer portal.

