      customer consent over the authenticated host secure.api.commbank.com.au.
      Wired to CommBank's first-party Payees Swagger 2.0 spec harvested verbatim
      from the developer portal.

  - aid: commonwealth-bank:cba-cdr-customer-api
    name: Commonwealth Bank CDR Customer API
    tags:
