        type: Documentation
      - url: https://developer.api.commbank.com.au/terms-of-use
        type: TermsOfService
    description: >-
      Documented in CommBank's business API catalogue: PayTo is a modern digital
      payment solution enabling near real-time, account-to-account payments from
      a customer's bank account over the New Payments Platform, replacing
      traditional direct debit with a customer-authorised mandate model.
      REST-based with OAuth 2.0 security. The OpenAPI specification is not
      published as a public download (catalogue access is granted at CommBank's
      discretion behind developer registration), so no spec is wired here to
      avoid fabrication.

