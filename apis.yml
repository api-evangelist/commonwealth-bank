        type: APIReference
      - url: openapi/commonwealth-bank-cdr-regular-payments-openapi.json
        type: OpenAPI
    description: >-
      Consumer-AUTHORIZED CDR surface covering the DSB Get Direct Debits,
      Get Bulk Direct Debits, Get Scheduled Payments and Get Bulk Scheduled
      Payments contracts (/banking/accounts/direct-debits,
      /banking/accounts/{accountId}/direct-debits, /banking/payments/scheduled,
      /banking/accounts/{accountId}/payments/scheduled). Available to Accredited
      Data Recipients with explicit customer consent over the authenticated host
      secure.api.commbank.com.au. Wired to CommBank's first-party Regular
      Payments Swagger 2.0 spec harvested verbatim from the developer portal.

