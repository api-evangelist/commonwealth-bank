- aid: commonwealth-bank:cba-fast-payment-credit-transfer-api
  name: Commonwealth Bank Fast Payment (Credit Transfer Initiation) API
  tags:
  - Payments
  - NPP
  - Real-Time Payments
  - Credit Transfer
  - Business
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.api.commbank.com.au/apis
  properties:
  - url: https://developer.api.commbank.com.au/apis
    type: Documentation
  - url: https://developer.api.commbank.com.au/terms-of-use
    type: TermsOfService
  description: >-
    Documented in CommBank's business API catalogue as the Credit Transfer Initiation / Fast Payment API:
    a near real-time capability that lets a business send money to most Australian financial institutions
    through the New Payments Platform (NPP). REST-based with OAuth 2.0 security. The full OpenAPI specification
    is not published as a public download — access to the catalogue and specs is granted at CommBank's
    discretion behind developer registration (partner-gated), so no spec is wired here to avoid fabrication.
- aid: commonwealth-bank:cba-namecheck-api
  name: Commonwealth Bank NameCheck API
  tags:
  - Payments
  - Fraud Prevention
  - Confirmation of Payee
  - Security
  - Business
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.api.commbank.com.au/apis/namecheck
  properties:
  - url: https://developer.api.commbank.com.au/apis/namecheck
    type: Documentation
  - url: https://developer.api.commbank.com.au/terms-of-use
    type: TermsOfService
  description: >-
    Documented in CommBank's business API catalogue: NameCheck is a security tool that helps organisations
    and their customers avoid false billing scams and mistaken payments by checking payee account name/number
    combinations before a payment is made. REST-based with OAuth 2.0 security. The OpenAPI specification
    is not published as a public download (catalogue access is granted at CommBank's discretion behind
    developer registration), so no spec is wired here to avoid fabrication.
- aid: commonwealth-bank:cba-payto-api
  name: Commonwealth Bank PayTo API
  tags:
