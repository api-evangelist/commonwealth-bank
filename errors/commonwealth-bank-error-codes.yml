format: http-status
envelope: 'Per-API HTTP status codes; OAuth token errors use the OAuth error/error_description JSON body (FX page
  example: {"error": "invalid_request", "error_description": ...}).'
apis:
- api: Fast Payments
  docs: https://docs.commbank.com.au/apis/fast-payments/error-codes
  problems:
  - status: 400
    title: Bad Request
    description: Validation error in the request payload
    remediation: Validate request fields before submission
  - status: 401
    title: Unauthorized
    description: Invalid or expired access token
    remediation: Generate a new access token
  - status: 403
    title: Forbidden
    description: Incorrect client permissions or token scope
    remediation: Confirm the access token contains the required scopes
  - status: 422
    title: Duplicate Request Conflict
    description: Reuse of an idempotency key with a modified payload
    remediation: Generate a new idempotency key if the request payload changes
  - status: 429
    title: Rate limit exceeded
    description: Too many requests submitted in a short period
    remediation: Retry the request after a delay
  - status: 500
    title: Internal Server Error
    description: Internal or downstream processing failure
    remediation: Retry the request
  - status: 501
    title: Payment Initiation services not implemented for the request
    description: Unsupported functionality or configuration
  - status: 503
    title: Payment Initiation services unavailable
    description: Service temporarily unavailable
