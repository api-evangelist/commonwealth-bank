    IBAN2007Identifier:
      type: string
      description: The International Bank Account Number is a code used
        internationally by financial institutions to uniquely identify the
        account of a customer at a financial institution as described in the
        2007 edition of the ISO 13616 standard "Banking and related financial
        services - International Bank Account Number (IBAN)" and replaced by the
        more recent edition of the standard.
      pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
    ISODate:
      type: string
      description: 'A particular point in the progression of time in a calendar year
        expressed in the YYYY-MM-DD format. This representation is defined in
        "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28
        October 2004" which is aligned with ISO 8601.'
      pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)(?:Z|[+-][01]\d:[0-5]\d)?$
    ISOYear:
      type: string
      description: Year represented by YYYY (ISO 8601).
      pattern: ^[1-9]\d{3}$
    LEIIdentifier:
      type: string
      description: Legal Entity Identifier is a code allocated to a party as described
        in ISO 17442 "Financial Services - Legal Entity Identifier (LEI)".
      pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
