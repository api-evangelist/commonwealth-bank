        Status Originator.


        In a Financial Institution Credit Transfer with cover: The Status
        Originator performed the account booking and transferred the cover
        transaction to the next Reimbursement Agent or to a Market
        Infrastructure. The payment transfer is tracked. No further updates will
        follow from the Status Originator.


        *`G001`-In an FI To FI Customer Credit Transfer: The Status Originator
        transferred the payment to the next Agent or to a Market Infrastructure.
        The payment transfer is not tracked. No further updates will follow from
        the Status Originator.


        In a Financial Institution Credit Transfer with cover: The Status
        Originator performed the account booking and transferred the cover
        transaction to the next Reimbursement Agent or to a Market
        Infrastructure. The payment transfer is not tracked. No further updates
        will follow from the Status Originator.


        *`G002`-In a FIToFI Customer Credit Transfer: Credit to the creditor’s
        account may not be confirmed same day. Update will follow from the
        Status Originator.

        In a Financial Institution Credit Transfer with cover: Debit/credit to
        nostro account may not be confirmed same day or Financial Institution
        Credit Transfer may not be transferred same day. Update will follow from
        the Status Originator.

        *`G003`-In a FIToFI Customer Credit Transfer: Credit to creditor’s
