        *`RPIN`-Document is a linked payment instruction to which the current
        payment instruction is related, for example, in a cover scenario.

        *`FXDR`-Document is a pre-agreed or pre-arranged foreign exchange
        transaction to which the payment transaction refers.

        *`DISP`-Document is a dispatch advice.

        *`PUOR`-Document is a purchase order.

        *`SCOR`-Document is a structured communication reference provided by the
        creditor to identify the referred transaction.
      enum:
        - RADM
        - RPIN
        - FXDR
        - DISP
        - PUOR
        - SCOR
    DocumentType6Code:
      type: string
      description: >-
        Specifies a type of financial or commercial document.

        *`MSIN`-Document is an invoice claiming payment for the supply of
        metered services, for example gas or electricity supplied to a fixed
        meter.

        *`CNFA`-Document is a credit note for the final amount settled for a
        commercial transaction.

        *`DNFA`-Document is a debit note for the final amount settled for a
        commercial transaction.

        *`CINV`-Document is an invoice.

        *`CREN`-Document is a credit note.

        *`DEBN`-Document is a debit note.

        *`HIRI`-Document is an invoice for the hiring of human resources or
        renting goods or equipment.

        *`SBIN`-Document is an invoice issued by the debtor.

        *`CMCN`-Document is an agreement between the parties, stipulating the
        terms and conditions of the delivery of goods or services.

        *`SOAC`-Document is a statement of the transactions posted to the
        debtor's account at the supplier.

        *`DISP`-Document is a dispatch advice.

        *`BOLD`-Document is a shipping notice.

        *`VCHR`-Document is an electronic payment document.

        *`AROI`-Document is a payment that applies to a specific source
        document.

        *`TSUT`-Document is a transaction identifier as assigned by the Trade
        Services Utility.

        *`PUOR`-Document is a purchase order.
      enum:
        - MSIN
        - CNFA
        - DNFA
        - CINV
        - CREN
        - DEBN
        - HIRI
        - SBIN
        - CMCN
        - SOAC
        - DISP
        - BOLD
        - VCHR
        - AROI
        - TSUT
        - PUOR
