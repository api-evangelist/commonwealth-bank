    ExternalTaxAmountType1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the nature, or use, of the amount in the format of
        character string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`CITY`-Tax accessed by city jurisdications within a country.

        *`CNTY`-Tax accessed by county jurisdications within a country.

        *`LOCL`-Tax accessed by local jurisdications within a country.

        *`PROV`-Tax accessed by province jurisdications within a country.

        *`STAT`-Tax accessed by state jurisdications within a country."
      enum:
        - CITY
        - CNTY
        - LOCL
        - PROV
        - STAT
    FinancialIdentificationSchemeName1Choice:
      type: object
      description: Sets of elements to identify a name of the organisation
        identification scheme.
      additionalProperties: true
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            code:
              description: Name of the identification scheme, in a coded form as published in
                an external list.
              $ref: "#/components/schemas/ExternalFinancialInstitutionIdentification1Code"
          required:
            - code
        - type: object
          additionalProperties: false
          properties:
            proprietary:
              description: Name of the identification scheme, in a free text form.
              $ref: "#/components/schemas/Max35Text"
          required:
            - proprietary
    FinancialInstitutionIdentification18:
      type: object
      description: Specifies the details to identify a financial institution.
      additionalProperties: false
      properties:
        bicfi:
          description: Code allocated to a financial institution by the ISO 9362
            Registration Authority as described in ISO 9362 "Banking - Banking
            telecommunication messages - Business identifier code (BIC)".
          $ref: "#/components/schemas/BICFIDec2014Identifier"
        clearing_system_member_identification:
          description: Information used to identify a member within a clearing system.
          $ref: "#/components/schemas/ClearingSystemMemberIdentification2"
        lei:
          description: Legal entity identifier of the financial institution.
          $ref: "#/components/schemas/LEIIdentifier"
        name:
