          maxItems: 2
          description: "User identification or any user key to be used to check whether
            the initiating party is allowed to initiate transactions from the
            account specified in the message.  Usage: The content is not of a
            technical nature, but reflects the organisational structure at the
            initiating side. The authorisation element can typically be used in
            relay scenarios, payment initiations, payment returns or payment
            reversals that are initiated on behalf of a party different from the
            initiating party."
          items:
            $ref: "#/components/schemas/Authorisation1Choice"
        number_of_transactions:
