    UUIDv4Identifier:
      type: string
      description: Universally Unique IDentifier (UUID) version 4, as described in
        IETC RFC 4122 "Universally Unique IDentifier (UUID) URN Namespace".
      pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$
    AdviceType1:
