        - type: object
          additionalProperties: false
          properties:
            proprietary:
              description: Advice type, in a proprietary form.
              $ref: "#/components/schemas/Max35Text"
          required:
            - proprietary
    AdviceType1Code:
      type: string
      description: |-
        Specifies the type of advice to provide back in the report.
        *`ADWD`-Advice with transaction details is requested.
        *`ADND`-Advice without  transaction details is requested.
      enum:
        - ADWD
        - ADND
    Authorisation1Choice:
      type: object
      description: Provides the details on the user identification or any user key
        that allows to check if the initiating party is allowed to issue the
        transaction.
      additionalProperties: true
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            code:
              description: Specifies the authorisation, in a coded form.
              $ref: "#/components/schemas/Authorisation1Code"
          required:
            - code
        - type: object
          additionalProperties: false
          properties:
            proprietary:
              description: Specifies the authorisation, in a free text form.
              $ref: "#/components/schemas/Max128Text"
          required:
            - proprietary
    Authorisation1Code:
      type: string
      description: >-
        Specifies the level of approval depending on a number of factors,
        including payment type, threshold amount or local country or operations
        practice.

        *`AUTH`-Indicates a file has been pre authorised or approved within the
        originating customer environment and no further approval is required.

        *`FDET`-Indicates that a file requires additional file level approval,
        with the ability to view both the payment information block and
        supporting customer credit transaction detail.

        *`FSUM`-Indicates that a file requires additional file level approval,
        with the ability to view only the payment information block level
        information.

        *`ILEV`-Indicates that a file requires all customer transactions to be
        authorised or approved.
      enum:
        - AUTH
        - FDET
        - FSUM
        - ILEV
    BatchBookingIndicator:
      type: boolean
      description: Identifies whether the sending party requests a single debit or
        credit entry per individual transaction or a batch entry for the sum of
        the amounts of all transactions.
    Cheque11:
      type: object
      description: Characteristics of a cheque instruction, such as cheque type or
        cheque number.
      additionalProperties: false
      properties:
        cheque_type:
          description: Specifies the type of cheque to be issued.
          $ref: "#/components/schemas/ChequeType2Code"
        cheque_number:
          description: Unique and unambiguous identifier for a cheque as assigned by the
            agent.
          $ref: "#/components/schemas/Max35Text"
        cheque_from:
          description: Identifies the party that ordered the issuance of the cheque.
          $ref: "#/components/schemas/NameAndAddress16"
        delivery_method:
          description: Specifies the delivery method of the cheque by the debtor's agent.
          $ref: "#/components/schemas/ChequeDeliveryMethod1Choice"
        deliver_to:
          description: Party to whom the debtor's agent needs to send the cheque.
          $ref: "#/components/schemas/NameAndAddress16"
        instruction_priority:
          description: Urgency or order of importance that the originator would like the
            recipient of the payment instruction to apply to the processing of
            the payment instruction.
          $ref: "#/components/schemas/Priority2Code"
        cheque_maturity_date:
          description: Date when the draft becomes payable and the debtor's account is
            debited.
          $ref: "#/components/schemas/ISODate"
        forms_code:
          description: Identifies, in a coded form, the cheque layout, company logo and
            digitised signature to be used to print the cheque, as agreed
            between the initiating party and the debtor's agent.
          $ref: "#/components/schemas/Max35Text"
        memo_field:
          type: array
          maxItems: 2
          description: Information that needs to be printed on a cheque, used by the payer
            to add miscellaneous information.
          items:
            $ref: "#/components/schemas/Max35Text"
        regional_clearing_zone:
          description: Regional area in which the cheque can be cleared, when a country
            has no nation-wide cheque clearing organisation.
          $ref: "#/components/schemas/Max35Text"
        print_location:
          description: Specifies the print location of the cheque.
          $ref: "#/components/schemas/Max35Text"
        signature:
          type: array
          maxItems: 5
          description: Signature to be used by the cheque servicer on a specific cheque to
            be printed.
          items:
            $ref: "#/components/schemas/Max70Text"
    ChequeDelivery1Code:
      type: string
      description: >-
        Specifies the method to be used in delivering a cheque to a party.

        *`MLDB`-Cheque is to be sent through mail services to debtor.

        *`MLCD`-Cheque is to be sent through mail services to creditor.

        *`MLFA`-Cheque is to be sent through mail services to creditor agent.

        *`CRDB`-Cheque is to be sent through courier services to debtor.

        *`CRCD`-Cheque is to be sent through courier services to creditor.

        *`CRFA`-Cheque is to be sent through courier services to creditor agent.

        *`PUDB`-Cheque will be picked up by the debtor.

        *`PUCD`-Cheque will be picked up by the creditor.

        *`PUFA`-Cheque will be picked up by the creditor agent.

        *`RGDB`-Cheque is to be sent through registered mail services to debtor.

        *`RGCD`-Cheque is to be sent through registered mail services to
        creditor.

        *`RGFA`-Cheque is to be sent through registered mail services to
        creditor agent.
      enum:
        - MLDB
        - MLCD
        - MLFA
        - CRDB
        - CRCD
        - CRFA
        - PUDB
        - PUCD
        - PUFA
        - RGDB
        - RGCD
        - RGFA
    ChequeDeliveryMethod1Choice:
      type: object
      description: Set of characteristics related to a cheque instruction, such as
        cheque type or cheque number.
      additionalProperties: true
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            code:
              description: Specifies the delivery method of the cheque by the debtor's agent.
              $ref: "#/components/schemas/ChequeDelivery1Code"
          required:
            - code
        - type: object
          additionalProperties: false
          properties:
            proprietary:
              description: Specifies a proprietary delivery method of the cheque by the
                debtor's agent.
              $ref: "#/components/schemas/Max35Text"
          required:
            - proprietary
    ChequeType2Code:
      type: string
      description: >-
        Specifies the type of cheque.

        *`CCHQ`-Cheque drawn on the account of the debtor, and debited on the
        debtor's account when the cheque is cashed. Synonym is 'corporate
        cheque'.

        *`CCCH`-Cheque drawn on the account of the debtor, and debited on the
        debtor's account when the cheque is cashed. The financial institution
        prints and certifies the cheque, guaranteeing the payment.

        *`BCHQ`-Cheque drawn on the account of the debtor's financial
        institution, which is debited on the debtor's account when the cheque is
        issued.These cheques are printed by the debtor's financial institution
        and payment is guaranteed by the financial institution. Synonym is
        'cashier's cheque'.

        *`DRFT`-A guaranteed bank cheque with a future value date (do not pay
        before], which in commercial terms is a 'negotiatable instrument': the
        beneficiary can receive early payment from any bank under subtraction of
        a discount. The ordering customer's account is debited on value date.

        *`ELDR`-An instrument with a future value date (do not pay before],
        which in commercial terms is a 'negotiatable instrument': the
        beneficiary can receive early payment from any bank under subtraction of
        a discount. The ordering customer's account is debited on value date.
      enum:
        - CCHQ
        - CCCH
        - BCHQ
        - DRFT
        - ELDR
