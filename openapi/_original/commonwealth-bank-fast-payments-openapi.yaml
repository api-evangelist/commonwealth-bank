      minLength: 1
      maxLength: 4
      description: "Specifies the external organisation identification scheme name
        code in the format of character string with a maximum length of 4
        characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`BANK`-Unique and unambiguous assignment made by a specific bank or
        similar financial institution to identify a relationship as defined
        between the bank and its client.\ 

        *`CBID`-A unique identification number assigned by a central bank to
        identify an organisation.

        *`CHID`-A unique identification number assigned by a clearing house to
        identify an organisation

        *`CINC`-A unique identification number assigned by a designated
        authority to a certificate of incorporation and used to identify an
        organisation.

        *`COID`-Country authority given organisation identification (e.g.,
        corporate registration number)

        *`CUST`-Number assigned by an issuer to identify a customer.

        Number assigned by a party to identify a creditor or debtor
        relationship.

        *`DUNS`-A unique identification number provided by Dun & Bradstreet to
        identify an organisation.

        *`EMPL`-Number assigned by a registration authority to an employer.

        *`GS1G`-Global Location Number. A non-significant reference number used
        to identify legal entities, functional entities, or physical entities
