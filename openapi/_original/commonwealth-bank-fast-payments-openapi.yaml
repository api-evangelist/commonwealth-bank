    CustomerCreditTransferInitiationV11Document:
      description: CustomerCreditTransferInitiationV11 Document
      type: object
      required:
        - customer_credit_transfer_initiation
      additionalProperties: false
      properties:
        customer_credit_transfer_initiation:
          $ref: "#/components/schemas/CustomerCreditTransferInitiationV11"
    CustomerCreditTransferInitiationV11:
      type: object
      description: >-
        **Scope**


        The CustomerCreditTransferInitiation message is sent by the initiating
        party to the forwarding agent or debtor agent. It is used to request
        movement of funds from the debtor account to a creditor.


        **Usage**


        The CustomerCreditTransferInitiation message can contain one or more
        customer credit transfer instructions.


        The CustomerCreditTransferInitiation message is used to exchange:


        - One or more instances of a credit transfer initiation;

        - Payment transactions that result in book transfers at the debtor agent
        or payments to another financial institution;

        - Payment transactions that result in an electronic cash transfer to the
        creditor account or in the emission of a cheque.


        The message can be used in a direct or a relay scenario:


        - In a direct scenario, the message is sent directly to the debtor
        agent. The debtor agent is the account servicer of the debtor.

        - In a relay scenario, the message is sent to a forwarding agent. The
        forwarding agent acts as a concentrating financial institution. It will
        forward the CustomerCreditTransferInitiation message to the debtor
        agent.


        The message can also be used by an initiating party that has authority
        to send the message on behalf of the debtor. This caters for example for
        the scenario of a payments factory initiating all payments on behalf of
        a large corporate.


        The CustomerCreditTransferInitiation message can be used in domestic and
        cross-border scenarios.


        The CustomerCreditTransferInitiation message must not be used by the
        debtor agent to execute the credit transfer instruction(s). The
        FIToFICustomerCreditTransfer message must be used instead.
      additionalProperties: false
      properties:
        group_header:
          description: Set of characteristics shared by all individual transactions
            included in the message.
          $ref: "#/components/schemas/GroupHeader95"
        payment_information:
          type: array
          description: Set of characteristics that applies to the debit side of the
            payment transactions included in the credit transfer initiation.
          items:
            $ref: "#/components/schemas/PaymentInstruction40"
        supplementary_data:
          type: array
          description: Additional information that cannot be captured in the structured
            elements and/or any other specific block.
          items:
            $ref: "#/components/schemas/SupplementaryData1"
      required:
        - group_header
        - payment_information
    ExchangeRate1:
      type: object
      description: Further detailed information on the exchange rate that has been
        used in the payment transaction.
      additionalProperties: false
      properties:
        unit_currency:
          description: Currency in which the rate of exchange is expressed in a currency
            exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
          $ref: "#/components/schemas/ActiveOrHistoricCurrencyCode"
        exchange_rate:
          description: The factor used for conversion of an amount from one currency to
            another. This reflects the price at which one currency was bought
            with another currency.
          $ref: "#/components/schemas/BaseOneRate"
        rate_type:
          description: Specifies the type used to complete the currency exchange.
          $ref: "#/components/schemas/ExchangeRateType1Code"
        contract_identification:
          description: Unique and unambiguous reference to the foreign exchange contract
            agreed between the initiating party/creditor and the debtor agent.
          $ref: "#/components/schemas/Max35Text"
    ExchangeRateType1Code:
      type: string
      description: >-
        Specifies a type of financial or commercial document.

        *`SPOT`-Exchange rate applied is the spot rate.

        *`SALE`-Exchange rate applied is the market rate at the time of the
        sale.

        *`AGRD`-Exchange rate applied is the rate agreed between the parties.
      enum:
        - SPOT
        - SALE
        - AGRD
    ExternalCreditorAgentInstruction1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: >-
        Specifies further instructions concerning the processing of a payment
        instruction, as provided to the creditor agent.

        *`CHQB`-(Ultimate) creditor must be paid by cheque.

        *`HOLD`-Amount of money must be held for the (ultimate) creditor, who
        will call. Pay on identification.

        *`PHOB`-Please advise/contact (ultimate) creditor/claimant by phone.

        *`PRTK`-Indicates that a payer token is requested/used.

        *`RECI`-Further information regarding the intended recipient. 

        *`TELB`-Please advise/contact (ultimate) creditor/claimant by the most
        efficient means of telecommunication.

        *`TKCM`-Token found with counterparty mismatch. 

        *`TKSG`-Single Use Token already used. 

        *`TKSP`-Token found with suspended status.

        *`TKVE`-Token found with value limit rule violation. 

        *`TKXP`-Token expired. 

        *`TOKN`-Token information.

        *`VLTK`-Additional validation information to be used in conjunction with
        the token.

        *`SEID`-Use of Secondary Identification of Creditor Account (which may
        relate to Head Office Collection Account, Building Society Roll Number
        or Credit Card Primary Account Number).
      enum:
        - CHQB
        - HOLD
        - PHOB
        - PRTK
        - RECI
        - TELB
        - TKCM
        - TKSG
        - TKSP
        - TKVE
        - TKXP
        - TOKN
        - VLTK
        - SEID
    ExternalDebtorAgentInstruction1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: >-
        Specifies further instructions concerning the processing of a payment
        instruction, as provided to the creditor agent.

        *`HOLD`-Amount of money must be held for the (ultimate) creditor, who
        will call. Pay on identification.

        *`CHQB`-(Ultimate) creditor must be paid by cheque.

        *`PRTK`-Indicates that a payer token is requested/used.

        *`PHOB`-Please advise/contact (ultimate) creditor/claimant by phone.

        *`TELB`-Please advise/contact (ultimate) creditor/claimant by the most
        efficient means of telecommunication.

        *`TOKN`-Token information.

        *`VLTK`-Additional validation information to be used in conjunction with
        the token.
      enum:
        - HOLD
        - CHQB
        - PRTK
        - PHOB
        - TELB
        - TOKN
        - VLTK
    GroupHeader95:
      type: object
      description: Set of characteristics shared by all individual transactions
