    ExternalServiceLevel1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the external service level code in the format of
        character string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`BKTR`-Payment through internal book transfer.

        *`G001`-Tracked Customer Credit Transfer.

        *`G002`-Tracked Stop and Recall\ 

        *`G003`-Tracked Outbound Corporate Transfer.

        *`G004`-Tracked Financial Institution Transfer.

        *`NPCA`-Payments must be executed following the NPC Area Payment scheme.

        *`NUGP`-Payment must be executed as a non-urgent transaction with
        priority settlement.

        *`NURG`-Payment must be executed as a non-urgent transaction, which is
        typically identified as an ACH or low value transaction.\ 

        *`PRPT`-Transaction must be processed according to the EBA Priority
        Service.

        *`SDVA`-Payment must be executed with same day value to the creditor.

        *`SEPA`-Payment must be executed following the Single Euro Payments Area
        scheme.

        *`SVDE`-Payment execution following the cheque agreement and traveller
        cheque agreement of the German Banking Industry Committee (Die Deutsche
        Kreditwirtschaft - DK) and Deutsche Bundesbank – Scheck Verrechnung
        Deutschland

        *`URGP`-Payment must be executed as an urgent transaction cleared
        through a real-time gross settlement system, which is typically
        identified as a wire or high value transaction. \ 

        *`URNS`-Payment must be executed as an urgent transaction cleared
        through a real-time net settlement system, which is typically identified
        as a wire or high value transaction. \ 

        *`INST`-Used for payment initiation to identify that a Payment or Direct
        Debit initiation must be executed as an instant or real-time payment
        instrument.

        *`SRTP`-Request to Pay (RTP) transaction refers to an RTP scheme (such
        as for example the SEPA Request to Pay (SRTP) scheme).

        *`SVAT`-Scheck Verarbeitung Austria (Cheque Processing).

        *`G006`-Specifies the service conditions applicable to a tracked
        exceptions and investigations case.

        *`G007`-Specifies the service level for a tracked inbound customer
        credit transfer.

        *`G005`-Tracked Instant Customer Credit Transfer.\r

        \r


        *`G009`-Specifies the service level for a tracked low-value cross-border
        customer credit transfer.

        *`WFSM`-Transaction is to be treated as an advice and only applied to
        the account of the creditor or next agent after settlement of the cover
        has been confirmed.

        *`EOLO`-Payment is executed following a Euro One-Leg Out Scheme.

        *`SPLI`-A split payment is a payment that is split into several payments
        of lower value, namely with the purpose to comply with maximum amount
        thresholds applicable to some domestic Payment Market Infrastructures or
        to reduce counterparty liquidity risk.

        *`IRCA`-Payment must be executed following the Icelandic Rulebook
        Council Area (IRCA) scheme.

        *`EAPS`-Identifies payments executed under the East African Payment
        System (EAPS), the regional cross-border settlement scheme operated by
        EAC central banks."
      enum:
        - BKTR
        - G001
        - G002
        - G003
        - G004
        - NPCA
        - NUGP
        - NURG
        - PRPT
        - SDVA
        - SEPA
        - SVDE
        - URGP
        - URNS
        - INST
        - SRTP
        - SVAT
        - G006
        - G007
        - G005
        - G009
        - WFSM
        - EOLO
        - SPLI
        - IRCA
        - EAPS
    ExternalStatusReason1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the status reason, as published in an external status
        reason code list.\r

        External code sets can be downloaded from www.iso20022.org.

        *`AB01`-Clearing process aborted due to timeout.  \ 

        *`AB02`-Clearing process aborted due to a fatal error.   

        *`AB03`-Settlement aborted due to timeout.   

        *`AB04`-Settlement process aborted due to a fatal error.   

        *`AB05`-Transaction stopped due to timeout at the Creditor Agent.

        *`AB06`-Transaction stopped due to timeout at the Instructed Agent.

        *`AB07`-Agent of message is not online.

        Generic usage if it cannot be determined who exactly is not online.

        *`AB08`-Creditor Agent is not online.

        *`AB09`-Transaction stopped due to error at the Creditor Agent.

        *`AB10`-Transaction stopped due to error at the Instructed Agent.

        *`AB11`-Transaction stopped due to timeout at the Debtor Agent.

        *`AC01`-Account number is invalid or missing.  \ 


        *`AC02`-Debtor account number invalid or missing

        *`AC03`-Creditor account number invalid or missing

        *`AC04`-Account number specified has been closed on the bank of
        account's books.\ 

        *`AC05`-Debtor account number closed

        *`AC06`-Account specified is blocked, prohibiting posting of
        transactions against it.

        *`AC07`-Creditor account number closed

        *`AC08`-Branch code is invalid or missing

        *`AC09`-Account currency is invalid or missing

        *`AC10`-Debtor account currency is invalid or missing

        *`AC11`-Creditor account currency is invalid or missing

        *`AC12`-Account type missing or invalid.

        Generic usage if cannot specify between group and payment information
        levels

        *`AC13`-Debtor account type missing or invalid

        *`AC14`-Creditor account type missing or invalid

        *`AC15`-The account details for the counterparty have changed.

        *`AC16`-Credit or debit card number is invalid.

        *`AG01`-Transaction forbidden on this type of account (formerly
        NoAgreement)

        *`AG02`-Bank Operation code specified in the message is not valid for
        receiver

        *`AG03`-Transaction type not supported/authorized on this account\ 

        *`AG04`-Agent country code is missing or invalid.

        Generic usage if cannot specify between group and payment information
        levels.

        *`AG05`-Debtor agent country code is missing or invalid

        *`AG06`-Creditor agent country code is missing or invalid

        *`AG07`-Debtor account cannot be debited for a generic reason.

        Code value may be used in general purposes and as a replacement for AM04
        if debtor bank does not reveal its customer's insufficient funds for
        privacy reasons

        *`AG08`-Transaction failed due to invalid or missing user or access
        right

        *`AG09`-Original payment never received.

        *`AG10`-Agent of message is suspended from the Real Time Payment system.

        Generic usage if it cannot be determined who exactly is suspended.

        *`AG11`-Creditor Agent of message is suspended from the Real Time
        Payment system.

        *`AG12`-Payment orders made by transferring funds from one account to
        another at the same financial institution (bank or payment institution)
        are not allowed.

        *`AG13`-Returned payments derived from previously returned transactions
        are not allowed.

        *`AGNT`-Agent in the payment workflow is incorrect

        *`AM01`-Specified message amount is equal to zero

        *`AM02`-Specific transaction/message amount is greater than allowed
        maximum

        *`AM03`-Specified message amount is an non processable currency outside
        of existing agreement

        *`AM04`-Amount of funds available to cover specified message amount is
        insufficient.

        *`AM05`-Duplication

        *`AM06`-Specified transaction amount is less than agreed minimum.

        *`AM07`-Amount specified in message has been blocked by regulatory
        authorities.

        *`AM09`-Amount received is not the amount agreed or expected

        *`AM10`-Sum of instructed amounts does not equal the control sum.

        *`AM11`-Transaction currency is invalid or missing

        *`AM12`-Amount is invalid or missing

        *`AM13`-Transaction amount exceeds limits set by clearing system

        *`AM14`-Transaction amount exceeds limits agreed between bank and client

        *`AM15`-Transaction amount below minimum set by clearing system

        *`AM16`-Control Sum at the Group level is invalid

        *`AM17`-Control Sum at the Payment Information level is invalid

        *`AM18`-Number of transactions is invalid or missing.

        Generic usage if cannot specify between group and payment information
        levels.

        *`AM19`-Number of transactions at the Group level is invalid or missing

        *`AM20`-Number of transactions at the Payment Information level is
        invalid

        *`AM21`-Transaction amount exceeds limits agreed between bank and
        client.

        *`AM22`-Unable to apply zero amount to designated account. For example,
        where the rules of a service allow the use of zero amount payments,
        however the back-office system is unable to apply the funds to the
        account. If the rules of a service prohibit the use of zero amount
        payments, then code AM01 is used to report the error condition.

        *`AM23`-Transaction amount exceeds settlement limit.

        *`BE01`-Identification of end customer is not consistent with associated
        account number. (formerly CreditorConsistency).

        *`BE04`-Specification of creditor's address, which is required for
        payment, is missing/not correct (formerly IncorrectCreditorAddress).

        *`BE05`-Party who initiated the message is not recognised by the end
        customer

        *`BE06`-End customer specified is not known at associated Sort/National
        Bank Code or does no longer exist in the books

        *`BE07`-Specification of debtor's address, which is required for
        payment, is missing/not correct.

        *`BE08`-Debtor name is missing

        *`BE09`-Country code is missing or Invalid.

        Generic usage if cannot specifically identify debtor or creditor

