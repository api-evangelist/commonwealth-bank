        2-factor-authentification.

        *`IPUW`-Transaction is made via an unattending vending machine by
        without using 2-factor-authentification.

        *`ANNI`-Transaction settles annuity related to credit, insurance,
        investments, other.n

        *`CAFI`-Transaction is the payment of custodian account management fee
        where custodian bank and current account servicing bank coincide.

        *`CFDI`-Transaction is the payment of capital falling due where
        custodian bank and current account servicing bank coincide.

        *`CMDT`-Transaction is payment of commodities.

        *`DERI`-Transaction is related to a derivatives transaction.

        *`DIVD`-Transaction is payment of dividends.

        *`FREX`-Transaction is related to a foreign exchange operation.

        *`HEDG`-Transaction is related to a hedging operation.

        *`INVS`-Transaction is for the payment of mutual funds, investment
        products and shares

        *`PRME`-Transaction is related to a precious metal operation.

        *`SAVG`-Transfer to / from savings or to retirement account.

        *`SECU`-Transaction is the payment of securities.

        *`SEPI`-Transaction is the payment of a purchase of securities where
        custodian bank and current account servicing bank coincide

        *`TREA`-Transaction is related to treasury operations.

        *`UNIT`-Transaction is purchase of Unit Trust

        *`FNET`-Cash associated with a netting of futures payments. Refer to
