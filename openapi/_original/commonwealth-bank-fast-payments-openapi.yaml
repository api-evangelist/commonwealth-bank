            between the IntermediaryAgent 2 and the CreditorAgent."
          $ref: "#/components/schemas/BranchAndFinancialInstitutionIdentification6"
        intermediary_agent3_account:
          description: Unambiguous identification of the account of the intermediary agent
            3 at its servicing agent in the payment chain.
          $ref: "#/components/schemas/CashAccount40"
        creditor_agent:
