    ExternalAccountIdentification1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the external account identification scheme name code in
        the format of character string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`AIIN`-Issuer Identification Number (IIN) - identifies a card issuing
        institution in an international interchange environment. Issued by ABA
        (American Bankers Association).

        *`BBAN`-Basic Bank Account Number (BBAN) - identifier used nationally by
        financial institutions, ie, in individual countries, generally as part
        of a National Account Numbering Scheme(s), to uniquely identify the
        account of a customer.

        *`CUID`-(United States) Clearing House Interbank Payments System (CHIPS)
        Universal Identification (UID) - identifies entities that own accounts
        at CHIPS participating financial institutions, through which CHIPS
        payments are effected. The CHIPS UID is assigned by the New York
        Clearing House.

        *`UPIC`-Universal Payment Identification Code (UPIC) - identifier used
        by the New York Clearing House to mask confidential data, such as bank
        accounts and bank routing numbers. UPIC numbers remain with business
        customers, regardless of banking relationship changes."
      enum:
        - AIIN
        - BBAN
        - CUID
        - UPIC
    ExternalCashAccountType1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the nature, or use, of the cash account in the format of
        character string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`CACC`-Account used to post debits and credits when no specific account
        has been nominated.

        *`CARD`-Account used for credit card payments.

        *`CASH`-Account used for the payment of cash.

        *`CHAR`-Account used for charges if different from the account for

        payment.

        *`CISH`-Account used for payment of income if different from the current
        cash account

        *`COMM`-Account used for commission if different from the account

        for payment.

        *`CPAC`-Account used to post settlement debit and credit entries on
        behalf of a designated Clearing Participant.

        *`LLSV`-Account used for savings with special interest and withdrawal
        terms. \ 

        *`LOAN`-Account used for loans.

        *`MGLD`-Account used for a marginal lending facility.

        *`MOMA`-Account used for money markets if different from the cash

        account.

        *`NREX`-Account used for non-resident external.

        *`ODFT`-Account is used for overdrafts.

        *`ONDP`-Account used for overnight deposits.

        *`OTHR`-Account not otherwise specified.\ 

        *`SACC`-Account used to post debit and credit entries, as a result of
        transactions cleared and settled through a specific clearing and
        settlement system.

        *`SLRY`-Accounts used for salary payments.

        *`SVGS`-Account used for savings.

        *`TAXE`-Account used for taxes if different from the account for

        payment.

        *`TRAN`-A transacting account is the most basic type of bank account
        that you can get. The main difference between transaction and cheque
        accounts is that you usually do not get a cheque book with your
        transacting account and neither are you offered an overdraft facility.

        *`TRAS`-Account used for trading if different from the current cash
        account.

        *`VACC`-Account created virtually to facilitate collection and
        reconciliation.

        *`NFCA`-Non-Resident Individual / Entity Foreign Current held
        domestically.

        *`RFCA`-Resident Individual Foreign Currency held domestically.

        *`REFC`-Resident Entity Foreign Currency held domestically.

        *`NLCY`-Non-Resident domestic currency account.

        *`RLCY`-Resident domestic currency account."
      enum:
        - CACC
        - CARD
        - CASH
        - CHAR
        - CISH
        - COMM
        - CPAC
        - LLSV
        - LOAN
        - MGLD
        - MOMA
        - NREX
        - ODFT
        - ONDP
        - OTHR
        - SACC
        - SLRY
        - SVGS
        - TAXE
        - TRAN
        - TRAS
        - VACC
        - NFCA
        - RFCA
        - REFC
        - NLCY
        - RLCY
    ExternalCashClearingSystem1Code:
      type: string
      minLength: 1
      maxLength: 3
      description: "Specifies the cash clearing system, as published in an external
        cash clearing system code list.\r

        External code sets can be downloaded from www.iso20022.org.

        *`ABE`-EBA Euro1/Step1.

        *`ACH`-Automated Clearing House. Payment system that clears cash
        transfers and settles the proceeds in a lump sum, usually on a
        multilateral netting basis.

        *`ACS`-Canadian Dollar (CAD)  - Automated Clearing Settlement System
        (ACSS)\ 

        *`AIP`-AL (Albania) -  Albania Interbank Payment System.

        *`ART`-AT (Austria) - Austrian RTGS.

        *`AVP`-NZ (New Zealand) - New Zealand Assured Value Payments.

        *`AZM`-AZ (Azerbaijan) - Azerbaijan Interbank Payment System (AZIPS).

        *`BAP`-BA (Bosnia and Herzegovina).

        *`BCC`-SE (Sweden) - Sweden BGC Clearing CUG.

        *`BCE`-EC (Ecuador) - Ecuadorian Central Payment System (Sistema Central
        de Pagos Ecuatoriano)

        *`BDS`-BB (Barbados) - Barbados RTGS (CBRTGS).

        *`BEL`-BE (Belgium) - Belgium RTGS (ELLIPS).

        *`BGN`-BG (Bulgaria) - Bulgaria RTGS.

        *`BHS`-BS (Bahamas) - Bahamas RTGS.

        *`BIS`-BW (Botswana) - Botswana Interbank Settlement System.

