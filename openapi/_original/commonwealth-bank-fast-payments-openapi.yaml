    CustomerPaymentStatusReportV12Document:
      description: CustomerPaymentStatusReportV12 Document
      type: object
      required:
        - customer_payment_status_report
      additionalProperties: false
      properties:
        customer_payment_status_report:
          $ref: "#/components/schemas/CustomerPaymentStatusReportV12"
    CustomerPaymentStatusReportV12:
      type: object
      description: >-
        **Scope**


        The CustomerPaymentStatusReport message is sent by an instructed agent
        to the previous party in the payment chain. It is used to inform this
        party about the positive or negative status of an instruction (either
        single or file). It is also used to report on a pending instruction.


        **Usage**


        The CustomerPaymentStatusReport message is exchanged between an agent
        and a non-financial institution customer to provide status information
        on instructions previously sent. Its usage will always be governed by a
        bilateral agreement between the agent and the non-financial institution
        customer.


        The CustomerPaymentStatusReport message can be used to provide
        information about the status (for example a rejection, an acceptance) of
        the initiation of a credit transfer, a direct debit, as well as on the
        initiation of other customer instructions.


        The CustomerPaymentStatusReport message refers to the original
        instruction(s) by means of references only or by means of references and
        a set of elements from the original instruction.


        The CustomerPaymentStatusReport message can be used in domestic and
        cross-border scenarios.


        The CustomerPaymentStatusReport may also be sent to the receiver of the
        payment in a real time payment scenario, as both sides of the
        transactions must be informed of the status of the transaction (that is
        either the beneficiary is credited, or the transaction is rejected).
      additionalProperties: false
      properties:
        group_header:
          description: Set of characteristics shared by all individual transactions
            included in the status report message.
          $ref: "#/components/schemas/GroupHeader86"
        original_group_information_and_status:
          description: Original group information concerning the group of transactions, to
            which the status report message refers to.
          $ref: "#/components/schemas/OriginalGroupHeader17"
        original_payment_information_and_status:
          type: array
          description: Information concerning the original payment information, to which
            the status report message refers.
          items:
            $ref: "#/components/schemas/OriginalPaymentInstruction40"
        supplementary_data:
          type: array
          description: Additional information that cannot be captured in the structured
            elements and/or any other specific block.
          items:
            $ref: "#/components/schemas/SupplementaryData1"
      required:
        - group_header
        - original_group_information_and_status
