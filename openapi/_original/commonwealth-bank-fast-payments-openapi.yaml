          $ref: "#/components/schemas/DecimalNumber"
        initiating_party:
          description: "Party that initiates the payment.  Usage: This can either be the
            debtor or the party that initiates the credit transfer on behalf of
            the debtor."
          $ref: "#/components/schemas/PartyIdentification135"
        forwarding_agent:
          description: Financial institution that receives the instruction from the
            initiating party and forwards it to the next agent in the payment
