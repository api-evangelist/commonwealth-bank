    ExternalPersonIdentification1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the external person identification scheme name code in
        the format of character string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`ARNU`-Number assigned by a social security agency to identify a
        non-resident person.

        *`CCPT`-Number assigned by an authority to identify the passport number
        of a person.

        *`CUST`-Number assigned by an issuer to identify a customer.

        *`DRLC`-Number assigned by an authority to identify a driver's license.

        *`EMPL`-Number assigned by a registration authority to an employee.

        *`NIDN`-Number assigned by an authority to identify the national
        identity number of a person.

        *`SOSE`-Number assigned by an authority to identify the social security
        number of a person.

        *`TELE`-Number assigned by a telephone or mobile phone operator to
        identify a person. A person may have multiple phone numbers.

        *`TXID`-Number assigned by a tax authority to identify a person.

        *`POID`-Commercial identification of the person.

        *`BANK`-Unique and unambiguous assignment made by a specific bank or
        similar financial institution to identify a relationship as defined
        between the bank and its client."
      enum:
        - ARNU
        - CCPT
        - CUST
        - DRLC
        - EMPL
        - NIDN
        - SOSE
        - TELE
        - TXID
        - POID
        - BANK
    ExternalProxyAccountType1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the external proxy account type code, as published in
        the proxy account type external code set.\r

        External code sets can be downloaded from www.iso20022.org.

        *`TELE`-A telephone number in the format specified by the 'The
        international public telecommunication numbering plan ITU-T E.164.\ 

        *`EMAL`-Internationalised address of an electronic mail box for internet
        messages.

        *`DNAM`-Internationalised internet domain name.

        *`CINC`-Corporate Identification issued by a national  institution or
        regulator, used as account proxy.\ 

        (applied for corporate account proxy).

        *`COTX`-Unique government-issued tax Identification used as account
        proxy to identify the corporate (for example for government tax) and
        typically linked to the corporate bank account (applied for corporate
        account proxy).

        *`COID`-Identification issued by a national  institution or regulator
        (different from a national scheme like a clearing provider), used as
        account proxy (applied for corporate or individual account proxy).

        *`CUST`-Any other customer identification number issued by a corporate,
        bank or other organization, used as account proxy.

        (applied for corporate or individual account proxy).

        *`DRLC`-Unique government-issued Identification used as account proxy
        to  identify the individual  (for example for government charges, road
        taxes and tolls,vaccination charges) and typically linked to the
        individual's bank account (applied for  individual account proxy).

        *`EIDN`-Government-issued Identification (different from a passport
        Identification or a national Identification). Used as account proxy
        to  identify the individual (for example for public benefits) and
        typically linked to the individual's bank account (applied
        for  individual account proxy).

        *`EWAL`-Market-adopted prepaid instruments like e-Wallets, payments to /
        from e-wallets from / to bank accounts (applied for corporate or
        individual account proxy).

        *`PVTX`-Unique government-issued  tax Identification  used as account
        proxy to  identify the individual  for example for government tax) and
        typically linked to the individual's bank account (applied
        for  individual account proxy).

        *`LEIC`-Legal Entity Identifier used as account proxy (applied for
        corporate account proxy).

        Use cases: Can be used by corporates as a \"government-issued\"
        Identification for registration with payment schemes as a proxy. The
        proxy may be further used for payments and collections using the
        underlying instant payment rails for a variety of corporate use cases.

        *`MBNO`-Mobile phone number in the format specified by the “The
        international public telecommunication numbering plan ITU- T E 164\"
        (applied for corporate or individual account proxy).

        *`NIDN`-Unique government-issued Identification  used as account proxy
        to  identify the individual  or corporate for example for public
        benefits, government subsidies) and typically linked to the individual's
        / corporate bank account.

        (applied for corporate or individual account proxy).

        *`CCPT`-Unique government-issued Identification  used as account proxy
        to  identify the individual  (for example for government charges, road
        taxes, vaccination charges) and typically linked to the individual's
        bank account

        (applied for  individual account proxy).

        *`SHID`-Account proxy issued by a payment scheme (applied for corporate
        or individual account proxy).

        Use cases: Any proxies issued by clearing systems, for example VPA
        (India), FPS Identifier (Hong Kong), Jompay (Malaysia) CCIN (Canada).

        *`SOSE`-Unique government-issued Identification  used as account proxy
        to identify the individual  (for example for public benefits) and
        typically linked to the individual's bank account (applied for
        individual account proxy).

        *`TOKN`-Electronic Identification used, for example, to mask an account
        number as a means of data secrecy.

        (applied for corporate or individual account proxy).

        *`UBIL`-Subscriber Identification for utilities and services. As opposed
        to a biller Identification, this identification is used for the
        subscriber of the service (applied for corporate or individual account
        proxy).

        *`VIPN`-Account proxy for receiving insurance claims, pay insurance
        premium, road tax payments, traffic tickets etc.(applied for corporate
        or individual account proxy).

        *`BIID`-Billers of specific utilities could register for a Biller
        Identification as supported in the clearing scheme, and use this
        identification for collections (applied for corporate account proxy)."
      enum:
        - TELE
        - EMAL
        - DNAM
        - CINC
        - COTX
        - COID
        - CUST
        - DRLC
        - EIDN
        - EWAL
        - PVTX
        - LEIC
        - MBNO
        - NIDN
        - CCPT
        - SHID
        - SOSE
        - TOKN
        - UBIL
        - VIPN
        - BIID
    ExternalPurpose1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the external purpose code in the format of character
        string with a maximum length of 4 characters.\r

        The list of valid codes is an external code list published separately.\r

        External code sets can be downloaded from www.iso20022.org.

        *`BKDF`-Delayed draw funding. Certain issuers may utilize delayed draw
        loans whereby the lender is committed to fund cash within a specified
        period once a call is made by the issuer. The lender receives a fee for
        entering into such a commitment.

        *`BKFE`-Bank loan fees. Cash activity related to specific bank loan
        fees, including (a) agent / assignment fees; (b) amendment fees; (c)
        commitment fees; (d) consent fees; (e) cost of carry fees; (f) delayed
        compensation fees; (g) facility fees; (h) fronting fees; (i) funding
        fees; (j) letter of credit assignment fees.

        *`BKFM`-Bank loan funding memo. Net cash movement for the loan contract
        final notification when sent separately from the loan contract final
        notification instruction.

        *`BKIP`-Accrued interest payments. Specific to bank loans.

        *`BKPP`-Principal paydowns. Specific to bank loans

        *`CBLK`-A Service that is settling money for a bulk of card
        transactions, while referring to a specific transaction file or other
        information like terminal ID, card acceptor ID or other transaction
        details.

        *`CDCB`-Purchase of Goods and Services with additional Cash disbursement
        at the POI (Cashback).

        *`CDCD`-ATM Cash Withdrawal in an unattended or Cash Advance in an
        attended environment (POI or bank counter).

        *`CDCS`-ATM Cash Withdrawal in an unattended or Cash Advance in an
        attended environment (POI or bank counter) with surcharging.

        *`CDDP`-A combined service which enables the card acceptor to perform an
        authorisation for a temporary amount and a completion for the final
        amount within a limited time frame. Deferred Payment is only available
        in the unattended environment. Examples where this service is widely
        used are unattended petrol pumps and phone booths.

        *`CDOC`-A service which allows the card acceptor to effect a credit to a
        cardholder' account. Unlike a Merchant Refund, an Original Credit is not
        preceded by a card payment. This service is used for example for
        crediting winnings from gaming.

        *`CDQC`-Purchase of Goods which are equivalent to cash like coupons in
        casinos.

        *`ETUP`-Transaction is related to a Service that is first reserving
        money from a card account and then is loading an e-purse application by
        this amount.

        *`FCOL`-A Service that is settling card transaction related fees between
        two parties.

        *`MTUP`-A Service that is first reserving money from a card account and
        then is loading a prepaid mobile phone amount by this amount.

        *`ACCT`-Transaction moves funds between 2 accounts of same account
        holder at the same bank.

        *`CASH`-Transaction is a general cash management instruction.

        *`COLL`-Transaction is a collection of funds initiated via a credit
        transfer or direct debit.

        *`CSDB`-Transaction is related to cash disbursement.

        *`DEPT`-Transaction is releted to a payment of deposit.

        *`INTC`-Transaction is an intra-company payment, ie, a payment between
        two companies belonging to the same group.

        *`INTP`-Transaction is a payment between two accounts belonging to the
        same party (intra-party payment), where party is a natural person
        (identified by a private ID, not organisation ID).

        *`LIMA`-Bank initiated account transfer to support zero target balance
        management, pooling or sweeping.

        *`NETT`-Transaction is related to a netting operation.

        *`BFWD`-Cash collateral related to any securities traded out beyond 3
        days which include treasury notes, JGBs and Gilts.

        *`CCIR`-Cash Collateral related to a Cross Currency Interest Rate Swap,
        indicating the exchange of fixed interest payments in one currency for
        those in another.

        *`CCPC`-Cash Collateral associated with an ISDA or Central Clearing
        Agreement that is covering the initial margin requirements for OTC
        trades clearing through a CCP.\ 

        *`CCPM`-Cash Collateral associated with an ISDA or Central Clearing
        Agreement that is covering the variation margin requirements for OTC
        trades clearing through a CCP.\ 

        *`CCSM`-CCP Segregated initial margin: Initial margin on OTC Derivatives
        cleared through a CCP that requires segregation.

        *`CRDS`-Cash collateral related to trading of credit default swap.

        *`CRPR`-Cash collateral related to a combination of various types of
        trades.

        *`CRSP`-Cash collateral related to cash lending/borrowing; letter of
        Credit; signing of master agreement.

        *`CRTL`-Cash collateral related to opening of a credit line before
        trading.

        *`EQPT`-Cash collateral related to trading of equity option (Also known
        as stock options).

        *`EQUS`-Cash collateral related to equity swap trades where the return
        of an equity is exchanged for either a fixed or a floating rate of
        interest.

        *`EXPT`-Cash collateral related to trading of an exotic option for
        example a non-standard option.

        *`EXTD`-Cash collateral related to trading of exchanged traded
        derivatives in general (Opposite to Over the Counter (OTC)).

        *`FIXI`-Cash collateral related to a fixed income instrument

        *`FWBC`-Cash collateral payment against a Master Forward Agreement (MFA)
        where the cash is held in a segregated account and is not available for
        use by the client. Includes any instruments with a forward settling date
        such TBAs, repurchase agreements and bond forwards

        *`FWCC`-Cash collateral payment against a Master Forward Agreement (MFA)
        where the cash is owned and may be used by the client when returned.
        Includes any instruments with a forward settling date such TBAs,
        repurchase agreements and bond forwards

        *`FWSB`-Any cash payment related to the collateral for a Master
        Agreement forward, which is segregated, and not available for use by the
        client. Example master agreement forwards include TBA, repo and Bond
        Forwards.

        *`FWSC`-Any cash payment related to the collateral for a Master
        agreement forward, which is owned by the client and is available for use
        by the client when it is returned to them from the segregated account.
        Example master agreement forwards include TBA, repo and Bond Forwards.

        *`MARG`-Daily margin on listed derivatives – not segregated as
        collateral associated with an FCM agreement. Examples include listed
        futures and options margin payments; premiums for listed options not
        covered in the MT54X message.

        *`MBSB`-MBS Broker Owned Segregated (40Act/Dodd Frank) Cash Collateral -
        Any cash payment related to the collateral for a Mortgage Back Security,
        which is segregated, and not available for use by the client.

        *`MBSC`-MBS Client Owned Cash Segregated (40Act/Dodd Frank) Cash
        Collateral - Any cash payment related to the collateral for a Mortgage
        Back Security, which is owned by the client and is available for use by
        the client when it is returned to them from the segregated account

        *`MGCC`-Initial futures margin. Where such payment is owned by the
        client and is available for use by them on return

        *`MGSC`-Margin Client Owned Segregated Cash Collateral - Any cash
        payment related to the collateral for initial futures margin, which is
        owned by the client and is available for use by the client when it is
        returned to them from the segregated account.

        *`OCCC`-Client owned collateral identified as eligible for OCC pledging.

        *`OPBC`-Cash collateral payment for OTC options associated with an FCM
        agreement. Where such payment is segregated and not available for use by
        the client

        *`OPCC`-Cash collateral payment for OTC options associated with an FCM
        agreement. Where such payment is not segregated and is available for use
        by the client upon return

        *`OPSB`-Option Broker Owned Segregated Cash Collateral - Any cash
        payment related to the collateral for an OTC option, which is
        segregated, and not available for use by the client.

        *`OPSC`-Option Client Owned Cash Segregated Cash Collateral - Any cash
        payment related to the collateral for an OTC option, which is owned by
        the client and is available for use by the client when it is returned to
        them from the segregated account

        *`OPTN`-Cash collateral related to trading of option on Foreign
        Exchange.

        *`OTCD`-Cash collateral related to Over-the-counter (OTC) Derivatives in
        general for example contracts which are traded and privately negotiated.

        *`REPO`-Cash collateral related to a repurchase agreement transaction.

        *`RPBC`-Bi-lateral repo broker owned collateral associated with a repo
        master agreement – GMRA or MRA Master Repo Agreements.

        *`RPCC`-Repo client owned collateral associated with a repo master
        agreement – GMRA or MRA Master Repo Agreements

        *`RPSB`-Bi-lateral repo broker owned segregated cash collateral
        associated with a repo master agreement.

        *`RPSC`-Repo client owned segregated collateral associated with a repo
        master agreement.

        *`RVPO`-Cash collateral related to a reverse repurchase agreement
        transaction.

        *`SBSC`-Cash collateral related to a Securities Buy Sell Sell Buy Back

        *`SCIE`-Cash collateral related to Exotic single currency interest rate
        swap.

        *`SCIR`-Cash collateral related to Single Currency Interest Rate Swap.

        *`SCRP`-Cash collateral related to Combination of securities-related
        exposure types.

        *`SHBC`-Short Sale broker owned collateral associated with a prime
        broker agreement.

        *`SHCC`-Short Sale client owned collateral associated with a prime
        brokerage agreement.

        *`SHSL`-Cash Collateral related to a Short Sell

        *`SLEB`-Cash collateral related to Securities lending and borrowing.

        *`SLOA`-Cash collateral related to a Secured loan.

        *`SWBC`-Cash collateral payment for swaps associated with an ISDA
        agreement. . Where such payment is segregated and

        not available for use by the client. Includes any cash collateral
        payments made under the terms of a CSA agreement

        for instruments such as swaps and FX forwards.

        *`SWCC`-Cash collateral payment for swaps associated with an ISDA
        agreement. Where such payment is not segregated and

        is available for use by the client upon return. Includes any cash
        collateral payments made under the terms of a CSA

        agreement for instruments such as swaps and FX forwards.

        *`SWPT`-Cash collateral related to an option on interest rate swap.

        *`SWSB`-Swaps Broker Owned Segregated Cash Collateral - Any cash payment
        related to the collateral for Swap margin ,

        which is segregated, and not available for use by the client. This
        includes any collateral identified in a CSA

        agreement such as Swap or FX Forward collateral.

        *`SWSC`-Swaps Client Owned Segregated Cash Collateral - Any cash payment
        related to the collateral for Swap margin,

        which is owned by the client and is available for use by the client when
        returned from the segregated account. This

        includes any collateral identified in a CSA agreement such as Swap or FX
        Forward collateral.

        *`TBAS`-Cash collateral related to a To Be Announced (TBA)

        *`TBBC`-Cash collateral payment (segregated) for TBA securities
        associated with a TBA Master Agreement. Where such payment is segregated
        and not available for use by the client.

        *`TBCC`-Cash collateral payment (for use by client)for TBA securities
        associated with a TBA Master Agreement. Where such payment is not
        segregated and is available for use by the client upon return.

        *`TRCP`-Cash collateral related to a combination of treasury-related
        exposure types.

        *`AGRT`-Transaction is related to the agricultural domain.

        *`AREN`-Transaction is related to a payment associated with an Account
        Receivable Entry

        *`BEXP`-Transaction is related to a payment of business expenses.

        *`BOCE`-Transaction is related to a payment associated with a Back
        Office Conversion Entry

        *`COMC`-Transaction is related to a payment of commercial credit or
        debit. (formerly CommercialCredit).

        *`CPYR`-Transaction is payment of copyright.

        *`GDDS`-Transaction is related to purchase and sale of goods.

        *`GDSV`-Transaction is related to purchase and sale of goods and
        services.

        *`GSCB`-Transaction is related to purchase and sale of goods and
        services with cash back.

        *`LICF`-Transaction is payment of a license fee.

        *`MP2B`-A service which enables a user to use an app on its mobile to
        pay a merchant or other business payees by initiating a payment message.
        Within this context, the account information or an alias of the payee
        might be transported through different channels to the app, for example
        QR Code, NFC, Bluetooth, other Networks.

        *`POPE`-Transaction is related to a payment associated with a Point of
