    ExternalCategoryPurpose1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the category purpose, as published in an external
        category purpose code list.\r

        External code sets can be downloaded from www.iso20022.org.

        *`BONU`-Transaction is the payment of a bonus.

        *`CASH`-Transaction is a general cash management instruction.

        *`CBLK`-A service that is settling money for a bulk of card
        transactions, while referring to a specific transaction file or other
        information like terminal ID, card acceptor ID or other transaction
        details.

        *`CCRD`-Transaction is related to a payment of credit card.

        *`CORT`-Transaction is related to settlement of a trade, eg a foreign
        exchange deal or a securities transaction.

        *`DCRD`-Transaction is related to a payment of debit card.

        *`DIVI`-Transaction is the payment of dividends.

        *`DVPM`-Code used to pre-advise the account servicer of a forthcoming
        deliver against payment instruction.

        *`EPAY`-Transaction is related to ePayment.

        *`FCIN`-Transaction is related to the payment of a fee and interest.

        *`FCOL`-A service that is settling card transaction related fees between
        two parties.

        *`GP2P`-General Person-to-Person Payment. Debtor and Creditor are
        natural persons.

        *`GOVT`-Transaction is a payment to or from a government department.

        *`HEDG`-Transaction is related to the payment of a hedging operation.

        *`ICCP`-Transaction is reimbursement of credit card payment.

        *`IDCP`-Transaction is reimbursement of debit card payment.

        *`INTC`-Transaction is an intra-company payment, ie, a payment between
        two companies belonging to the same group.

        *`INTE`-Transaction is the payment of interest.

        *`LBOX`-Transaction is related to identify cash handling via Night Safe
        or Lockbox by bank or vendor on behalf of a physical store.

        *`LOAN`-Transaction is related to the transfer of a loan to a borrower.

        *`MP2B`-Mobile P2B Payment

        *`MP2P`-Mobile P2P Payment

        *`OTHR`-Other payment purpose.

        *`PENS`-Transaction is the payment of pension.

        *`RPRE`-Collection used to re-present previously reversed or returned
        direct debit transactions.

        *`RRCT`-Transaction is related to a reimbursement for commercial reasons
        of a correctly received credit transfer.

        *`RVPM`-Code used to pre-advise the account servicer of a forthcoming
        receive against payment instruction.

        *`SALA`-Transaction is the payment of salaries.

        *`SECU`-Transaction is the payment of securities.

        *`SSBE`-Transaction is a social security benefit, ie payment made by a
        government to support individuals.

        *`SUPP`-Transaction is related to a payment to a supplier.

        *`TAXS`-Transaction is the payment of taxes.

        *`TRAD`-Transaction is related to the payment of a trade finance
        transaction.

        *`TREA`-Transaction is related to treasury operations.  E.g. financial
        contract settlement.

        *`VATX`-Transaction is the payment of value added tax.

        *`WHLD`-Transaction is the payment of withholding tax.

        *`SWEP`-Classification: Cash Management. Transaction relates to a cash
        management instruction, requesting a sweep of the account of the Debtor
        above an agreed floor amount, up to a target or zero balance.\r

        The purpose is to move the funds from multiple accounts to a single bank
        account. Funds can move domestically or across border and more than one
        bank can be used.

        *`TOPG`-Classification: Cash Management. Transaction relates to a cash
        management instruction, requesting to top the account of the Creditor
        above a certain floor amount, up to a target or zero balance. \r

        The floor amount, if not pre-agreed by the parties involved, may be
        specified.

        *`ZABA`-Transaction relates to a cash management instruction, requesting
        to zero balance the account of the Debtor.\r

        Zero Balance Accounts empty or fill the balances in accounts at the same
        bank, in the same country into or out of a main account each day.

        *`VOST`-Transaction to be processed as a domestic payment instruction
        originated from a foreign bank.

        *`FCDT`-Foreign Currency Transaction that is processed between two
        domestic financial institutions.

        *`CIPC`-Transaction is a direct debit for a cash order of notes and/or
        coins.

        *`CONC`-Transaction is a direct debit for a cash order of notes and/or
        coins.

        *`CGWV`-Transaction is a payment towards a Party for the collection of
        cash by the Cash in Transit company.

        *`SAVG`-Transfer to / from savings or to retirement account.

        *`CTDF`-Cross border transaction initiated by US natural person that is
        subject to compliance with Dodd Frank 1073."
      enum:
        - BONU
        - CASH
        - CBLK
        - CCRD
        - CORT
        - DCRD
        - DIVI
        - DVPM
        - EPAY
        - FCIN
        - FCOL
        - GP2P
        - GOVT
        - HEDG
        - ICCP
        - IDCP
        - INTC
        - INTE
        - LBOX
        - LOAN
        - MP2B
        - MP2P
        - OTHR
        - PENS
        - RPRE
        - RRCT
        - RVPM
        - SALA
        - SECU
        - SSBE
        - SUPP
        - TAXS
        - TRAD
        - TREA
        - VATX
        - WHLD
        - SWEP
        - TOPG
        - ZABA
        - VOST
        - FCDT
        - CIPC
        - CONC
