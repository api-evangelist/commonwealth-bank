    ExternalPaymentGroupStatus1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the status of a group of payment instructions, as
        published in an external payment group status code set.\r

        External code sets can be downloaded from www.iso20022.org.

        *`ACCP`-Preceding check of technical validation was successful. Customer
        profile check was also successful.

        *`ACCC`-Settlement on the creditor's account has been completed.

        *`ACSC`-Settlement on the debtor's account has been completed.

        Usage : this can be used by the first agent to report to the debtor that
        the transaction has been completed.\ 

        Warning : this status is provided for transaction status reasons, not
        for financial information. It can only be used after bilateral agreement


        *`ACSP`-All preceding checks such as technical validation and customer
        profile were successful and therefore the payment initiation has been
        accepted for execution.

        *`ACTC`-Authentication and syntactical and semantical validation are
        successful

        *`ACWC`-Instruction is accepted but a change will be made, such as date
        or remittance not sent.

        *`PART`-A number of transactions have been accepted, whereas another
        number of transactions have not yet achieved

        'accepted' status.

        *`PDNG`-Payment initiation or individual transaction included in the
        payment initiation is pending. Further checks and status update will be
        performed.

        *`RCVD`-Payment initiation has been received by the receiving agent

        *`RJCT`-Payment initiation or individual transaction included in the
        payment initiation has been rejected.

        *`RCVC`-Verification of Payee check have been applied to received
        transactions stating to be complete without mismatching data.

        *`RVCM`-Verification of Payee checks have been applied to received
        transactions stating to be complete containing mismatching data.

        *`RVNC`-Verification of party check on transactions received is not yet
        completed."
      enum:
        - ACCP
        - ACCC
        - ACSC
        - ACSP
        - ACTC
        - ACWC
        - PART
        - PDNG
        - RCVD
        - RJCT
        - RCVC
        - RVCM
        - RVNC
    ExternalPaymentTransactionStatus1Code:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the status of an individual payment instructions, as
        published in an external payment transaction status code set.\r

        External code sets can be downloaded from www.iso20022.org.

        *`ACCC`-Settlement on the creditor's account has been completed.

        *`ACCP`-Preceding check of technical validation was successful. Customer
        profile check was also successful.

        *`ACFC`-Preceding check of technical validation and customer profile was
        successful and an automatic funds check was positive.

        *`ACIS`-Payment instruction to issue a cheque has been accepted, and the
        cheque has been issued but not yet been deposited or cleared.

        *`ACSC`-Settlement completed.

        Usage : this can be used by a Market Infrastructure reporting to
        Infrastructure Participant or an Account Servicer to Account Owner to
        report that the transaction account entry has been completed.

        Warning : this status is provided for transaction status reasons, not
        for financial information. It can only be used after bilateral agreement


        *`ACSP`-All preceding checks such as technical validation and customer
        profile were successful and therefore the payment instruction has been
        accepted for execution.

        *`ACTC`-Authentication and syntactical and semantical validation are
        successful

        *`ACWC`-Instruction is accepted but a change will be made, such as date
        or remittance not sent.

        *`ACWP`-Payment instruction included in the credit transfer is accepted
        without being posted to the creditor customer’s account.

        *`BLCK`-Payment transaction previously reported with status 'ACWP' is
        blocked, for example, funds will neither be posted to the Creditor's
        account, nor be returned to the Debtor.

        *`CANC`-Payment initiation has been successfully cancelled after having
        received a request for cancellation.

        Usage: code to be used in the context of APIs only.

        *`CPUC`-Cash has been picked up by the Creditor.

        *`PATC`-Payment initiation needs multiple authentications, where some
        but not yet all have been performed. Syntactical and semantical
        validations are successful.

        *`PDNG`-Payment instruction is pending. Further checks and status update
        will be performed.

        *`PRES`-Request for Payment has been presented to the Debtor.

        *`RCVD`-Payment instruction has been received.

        *`RJCT`-Payment instruction has been rejected.

        *`ACPD`-Status of transaction released from the Debtor Agent and
        accepted by the clearing.

        *`RCVC`-Verification of Payee check has been applied to received
        transaction stating to be complete without mismatching data.

        *`RVNA`-Verification of Payee check has been applied to received
        transaction stating to be complete with not applicable data.

        *`RVNM`-Verification of Payee check has been applied to received
        transaction stating to be complete with mismatching data.

        *`RVMC`-Verification of Payee check has been applied to received
        transaction stating to be complete with data matching closely.

        *`ACFW`-Preceding check of technical validation and customer profile was
        successful, and an automatic funds check was positive, but an explicit
        confirmation by the initiating party is outstanding.

        *`RVNC`-Verification of party check on the transaction is not yet
        completed.

        *`RVCM`-Verification of Payee checks have been applied to received
        transaction stating to be completed containing mismatching data."
      enum:
