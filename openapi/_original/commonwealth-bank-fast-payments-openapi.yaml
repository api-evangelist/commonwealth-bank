    BusinessApplicationHeader8:
      type: object
      description: >-
        Specifies the Business Application Header of the Business Message.


        Can be used when replying to a query; can also be used when cancelling
        or amending.
      additionalProperties: false
      properties:
        character_set:
          description: Contains the character set of the text-based elements used in the
            Business Message.
          $ref: "#/components/schemas/UnicodeChartsCode"
        from:
          description: The sending MessagingEndpoint that has created this Business
            Message for the receiving MessagingEndpoint that will process this
            Business Message.  Note	the sending MessagingEndpoint might be
            different from the sending address potentially contained in the
            transport header (as defined in the transport layer).
          $ref: "#/components/schemas/Party51Choice"
        to:
          description: The MessagingEndpoint designated by the sending MessagingEndpoint
            to be the recipient who will ultimately process this Business
            Message.  Note the receiving MessagingEndpoint might be different
            from the receiving address potentially contained in the transport
            header (as defined in the transport layer).
          $ref: "#/components/schemas/Party51Choice"
        business_message_identifier:
          description: Unambiguously identifies the Business Message to the
            MessagingEndpoint that has created the Business Message.
          $ref: "#/components/schemas/Max35Text"
        message_definition_identifier:
          description: The Message Definition Identifier of the Business Message instance
            with which this Business Application Header instance is associated.
          $ref: "#/components/schemas/Max35Text"
        business_service:
          description: "Specifies the business service agreed between the two
            MessagingEndpoints under which rules this Business Message is
            exchanged. To be used when there is a choice of processing services
            or processing service levels.  Example:  “marketx.hvps.01” and
            “marketx.xbdr.01” might be used to indicate that the associated
            messages are subject to different processing levels for domestic
            high value payments versus cross-border payments  within the same
            market practice."
          $ref: "#/components/schemas/Max35Text"
        market_practice:
          description: Specifies the market practice to which the message conforms. The
            market practices are a set of rules agreed between parties that
            restricts the usage of the messages in order to achieve better STP
            (Straight Through Processing) rates. A market practice specification
            may also extend the underlying message specification by using
            extensions or supplementary data of this underlying message.
          $ref: "#/components/schemas/ImplementationSpecification1"
        creation_date:
          description: Date and time when this Business Message (header) was created. Note
            Times must be normalized, using the "Z" annotation.
          $ref: "#/components/schemas/ISODateTime"
        business_processing_date:
          description: "Processing date and time indicated by the sender for the receiver
            of the business message. This date may be different from the date
            and time provided in the CreationDate.  Usage: Market practice or
            bilateral agreement should specify how this element should be used."
          $ref: "#/components/schemas/ISODateTime"
        copy_duplicate:
          description: Indicates whether the message is a Copy, a Duplicate or a copy of a
            duplicate of a previously sent ISO 20022 Message.
          $ref: "#/components/schemas/CopyDuplicate1Code"
        possible_duplicate:
          description: 'Flag indicating if the Business Message exchanged between the
            MessagingEndpoints is possibly a duplicate.  If the receiving
            MessagingEndpoint did not receive the original, then this Business
            Message should be processed as if it were the original.   If the
            receiving MessagingEndpoint did receive the original, then it should
            perform necessary actions to avoid processing this Business Message
            again.  This will guarantee business idempotent behaviour.  NOTE:
            this is named "PossResend" in FIX - this is an application level
            resend not a network level retransmission.'
          $ref: "#/components/schemas/YesNoIndicator"
        priority:
          description: Relative indication of the processing precedence of the message
            over a (set of) Business Messages with assigned priorities.
          $ref: "#/components/schemas/BusinessMessagePriorityCode"
        signature:
          description: Contains the digital signature of the Business Entity authorised to
            sign this Business Message.
          $ref: "#/components/schemas/SignatureEnvelope"
      required:
        - from
        - to
        - business_message_identifier
        - message_definition_identifier
        - creation_date
    BusinessApplicationHeaderV04:
      type: object
      description: >-
        The Business Layer deals with Business Messages. The behaviour of the
        Business Messages is fully described by the Business Transaction and the
        structure of the Business Messages is fully described by the Message
        Definitions and related Message Rules, Rules and Market Practices. All
        of which are registered in the ISO 20022 Repository.


        A single new Business Message (with its accompanying business
        application header) is created - by the sending MessagingEndpoint - for
        each business event; that is each interaction in a Business Transaction.
        A Business Message adheres to the following principles:


        - A Business Message (and its business application header) must not
        contain information about the Message Transport System or the mechanics
        or mechanism of message sending, transportation, or receipt.

        - A Business Message must be comprehensible outside of the context of
        the Transport Message. That is the Business Message must not require
        knowledge of the Transport Message to be understood.

        - A Business Message may contain headers, footers, and envelopes that
        are meaningful for the business. When present, they are treated as any
        other message content, which means that they are considered part of the
        Message Definition of the Business Message and as such will be part of
        the ISO 20022 Repository.

        - A Business Message refers to Business Actors by their Name. Each
        instance of a Business Actor has one Name. The Business Actor must not
        be referred to in the Transport Layer.


        Specific usage of this BusinessMessageHeader may be defined by the
        relevant SEG.
      additionalProperties: false
      properties:
        character_set:
          description: Contains the character set of the text-based elements used in the
            Business Message.
          $ref: "#/components/schemas/UnicodeChartsCode"
        from:
          description: The sending MessagingEndpoint that has created this Business
            Message for the receiving MessagingEndpoint that will process this
            Business Message.  Note	the sending MessagingEndpoint might be
            different from the sending address potentially contained in the
            transport header (as defined in the transport layer).
          $ref: "#/components/schemas/Party51Choice"
        to:
          description: The MessagingEndpoint designated by the sending MessagingEndpoint
            to be the recipient who will ultimately process this Business
            Message.  Note the receiving MessagingEndpoint might be different
            from the receiving address potentially contained in the transport
            header (as defined in the transport layer).
          $ref: "#/components/schemas/Party51Choice"
        business_message_identifier:
          description: Unambiguously identifies the Business Message to the
            MessagingEndpoint that has created the Business Message.
          $ref: "#/components/schemas/Max35Text"
        message_definition_identifier:
          description: The Message Definition Identifier of the Business Message instance
            with which this Business Application Header instance is associated.
          $ref: "#/components/schemas/Max35Text"
        business_service:
          description: "Specifies the business service agreed between the two
            MessagingEndpoints under which rules this Business Message is
            exchanged. To be used when there is a choice of processing services
            or processing service levels.  Example:  “marketx.hvps.01” and
            “marketx.xbdr.01” might be used to indicate that the associated
            messages are subject to different processing levels for domestic
            high value payments versus cross-border payments  within the same
            market practice."
          $ref: "#/components/schemas/Max35Text"
        market_practice:
          description: Specifies the market practice to which the message conforms. The
            market practices are a set of rules agreed between parties that
            restricts the usage of the messages in order to achieve better STP
            (Straight Through Processing) rates. A market practice specification
            may also extend the underlying message specification by using
            extensions or supplementary data of this underlying message.
          $ref: "#/components/schemas/ImplementationSpecification1"
        creation_date:
          description: Date and time when this Business Message (header) was created.
          $ref: "#/components/schemas/ISODateTime"
        business_processing_date:
          description: "Processing date and time indicated by the sender for the receiver
            of the business message. This date may be different from the date
            and time provided in the CreationDate.  Usage: Market practice or
            bilateral agreement should specify how this element should be used."
          $ref: "#/components/schemas/ISODateTime"
        copy_duplicate:
          description: Indicates whether the message is a Copy, a Duplicate or a copy of a
            duplicate of a previously sent ISO 20022 Message.
          $ref: "#/components/schemas/CopyDuplicate1Code"
        possible_duplicate:
          description: 'Flag indicating if the Business Message exchanged between the
            MessagingEndpoints is possibly a duplicate.  If the receiving
            MessagingEndpoint did not receive the original, then this Business
            Message should be processed as if it were the original.   If the
            receiving MessagingEndpoint did receive the original, then it should
            perform necessary actions to avoid processing this Business Message
            again.  This will guarantee business idempotent behaviour.  NOTE:
            this is named "PossResend" in FIX - this is an application level
            resend not a network level retransmission.'
          $ref: "#/components/schemas/YesNoIndicator"
        priority:
          description: Relative indication of the processing precedence of the message
            over a (set of) Business Messages with assigned priorities.
          $ref: "#/components/schemas/BusinessMessagePriorityCode"
        signature:
          description: Contains the digital signature of the Business Entity authorised to
            sign this Business Message.
          $ref: "#/components/schemas/SignatureEnvelope"
        related:
          type: array
          description: Specifies the Business Application Header(s) of the Business
            Message(s) to which this Business Message relates. Can be used when
            replying to a query; can also be used when canceling or amending.
          items:
            $ref: "#/components/schemas/BusinessApplicationHeader8"
      required:
