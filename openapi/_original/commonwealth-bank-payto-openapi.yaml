      description: Full Legal Account Name recorded by the Account Server in their
        records. Specifies a character string with a maximum length of 140 ASCII
        printable characters.
    ultimatePartyName:
      type: string
      format: string
      pattern: ^.*$
      minLength: 1
      maxLength: 140
      description: >-
        Name by which the ultimate party is known and which is usually used to
        identify that party.

        Specifies a character string with a maximum length of 140 ASCII
        printable characters.
