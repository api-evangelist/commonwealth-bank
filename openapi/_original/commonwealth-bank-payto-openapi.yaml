      enum:
        - bankAccount
        - alternateIdentification
      description: >-
        Type of account identification. Following rules apply

        - bankAccount: BSB and account number must be provided, and
        alternateIdentification must not be provided.

        - alternateIdentification: alternateIdentification must be provided, and
        BSB and account number must not be provided.
    accountName:
      type: string
      format: string
      pattern: ^.*$
      minLength: 1
