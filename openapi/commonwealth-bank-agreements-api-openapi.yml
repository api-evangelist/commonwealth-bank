      description: Short description of the reason for agreement  setup as narrative text. Specifies a character string with a maximum length of 35 ASCII printable characters.
      maxLength: 35
    accountWrapper:
      type: object
      required:
      - account
      properties:
        account:
          $ref: '#/components/schemas/accountReference'
      title: ''
    accountType:
      type: string
      maxLength: 24
      format: string
      pattern: ^[a-zA-Z\s]+$
      enum:
      - bankAccount
      - alternateIdentification
      description: 'Type of account identification. Following rules apply

        - bankAccount: BSB and account number must be provided, and alternateIdentification must not be provided.

        - alternateIdentification: alternateIdentification must be provided, and BSB and account number must not be provided.'
    partyAccount:
      type: object
      required:
      - account
      - party
      properties:
        account:
          $ref: '#/components/schemas/accountReference'
        party:
          $ref: '#/components/schemas/party'
    firstCollectionDate:
