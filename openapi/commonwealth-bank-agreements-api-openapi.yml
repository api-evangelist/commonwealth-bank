          type: string
          description: Error code indicating the type of validation failure
          example: ACCOUNT_VALIDATION_FAILED
        message:
          type: string
          description: Human-readable summary of the validation failure
          example: One or more accounts are not valid for PayTo agreements.
        details:
          type: array
          description: Per-field validation issues
          items:
            $ref: '#/components/schemas/validationDetail'
