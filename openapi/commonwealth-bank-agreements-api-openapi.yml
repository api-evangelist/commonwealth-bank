        idType:
          type: string
          maxLength: 64
          format: string
          pattern: ^[a-zA-Z\s]+$
          description: The party identifier type
          enum:
          - passportNumber
          - customerIdentificationNumber
          - driversLicenseNumber
          - employeeIdentificationNumber
          - taxIdentificationNumber
          - bankPartyIdentification
          - certificateOfIncorporationNumber
          - australianBusinessNumber
          - australianCompanyNumber
        id:
          type: string
          description: The party identifier
          maxLength: 64
          format: string
          pattern: ^.*$
        ultimatePartyName:
          $ref: '#/components/schemas/ultimatePartyName'
    agreementValidationRequest:
      title: AgreementValidationRequest
      type: object
      properties:
        source:
          description: The account where funds will be debited
          $ref: '#/components/schemas/accountWrapper'
        destination:
          description: The account where funds will be credited
          $ref: '#/components/schemas/accountWrapper'
        initiatingParty:
          description: The party initiating the agreement
          $ref: '#/components/schemas/initiatingParty'
      required:
      - source
      - destination
      - initiatingParty
    bsb:
      type: string
      pattern: ^[0-9]{6}$
      maxLength: 6
      format: string
      description: The BSB (Bank-State-Branch) code
    changeAgreementStatusResponse:
      type: object
      properties:
        referenceNumber:
          $ref: '#/components/schemas/uuid'
          description: Unique ID to identify the agreement status change request.
    reference:
      type: string
      pattern: ^.*$
