reversibility:
  status: documented
  surfaces:
  - surface: PayTo agreements
    reversal: cancel (or suspend / release) via PATCH /agreements/{id}/status
    operationId: change-agreement-status
    window: null
    window_text: The status can only be changed when the agreement is currently active or suspended.
    docs: https://docs.commbank.com.au/apis/payto/change-agreement-status
    note: A cancelled agreement cannot be further updated. This is a state precondition, not a time window.
  - surface: FX quotes
    reversal: partnerCancelQuote (DELETE /partner/api/markets/fx/quote/{quote_id})
    operationId: partnerCancelQuote
    window: null
    docs: https://docs.commbank.com.au/apis/fx/partner-cancel-quote
    note: Cancels an FX quote that is no longer required or will not be executed; the docs state no reversal for
      an accepted (executed) trade.
  - surface: Fast Payments credit transfer (NPP)
    reversal: null
    operationId: null
    docs: https://docs.commbank.com.au/apis/fast-payments/
    note: No recall/reversal operation is documented for an initiated credit transfer.
  - surface: PayTo payment initiation
    reversal: null
    operationId: null
    note: No reversal operation documented for post-agreements-id-payments.
  note: No reversal window is stated anywhere in the docs read; none is asserted.
authentication_business_apis:
  style: OAuth 2.0 client credentials with a signed JWT client assertion (EC P-256 key pair), over mTLS + IP allow-listing
  token_lifetime: Access tokens are short-lived (typically under 2 minutes, based on expires_in).
  docs: https://docs.commbank.com.au/learners/security-and-getting-access/authentication
