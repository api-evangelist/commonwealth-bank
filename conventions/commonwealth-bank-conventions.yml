generated: '2026-10-20'
method: searched
source: Consumer Data Standards Australia CDR Banking v1.36.0 (HTTP headers, pagination, error) + CommBank developer
  portal. Derived from openapi/ global parameters. + CommBank API Developer Docs (https://docs.commbank.com.au/)
  for the business APIs (Fast Payments, PayTo, FX, NameCheck).
authentication:
  style: CDR ADR OAuth2 authorization_code + OIDC/FAPI for authorised endpoints; public Product Reference Data is
    unauthenticated. See authentication/commonwealth-bank-authentication.yml and scopes/commonwealth-bank-scopes.yml.
versioning:
  style: header
  request_header: x-v
  min_version_header: x-min-v
  response_header: x-v
  note: Every endpoint is versioned via the mandatory x-v request header; omitting or sending an unsupported version
    returns HTTP 406. x-min-v allows negotiating an acceptable range. This is CDR's endpoint-level versioning (not
    URI-path).
idempotency:
  coverage: partial
  header: x-idempotency-id
  scope:
  - post-v1-payment-initiation
  - CreateAgreement
  - patch-agreement-id
  - change-agreement-status
  - post-agreements-id-payments
  conflict_status: 422
  note: The CDR data-sharing surface is read-only and has no idempotency contract. The business payment APIs carry
    a required x-idempotency-id header on the Fast Payments credit-transfer initiation and on the PayTo create/amend/status/payment
    writes ("It must be provided in every request and have the same value in case of an idempotent retry"). Reusing
    a key with a modified payload returns 422 Duplicate Request Conflict. FX partnerAcceptQuote/partnerGetQuote/partnerCancelQuote
    and NameCheck declare no idempotency header. Retention window is not stated.
  docs: https://docs.commbank.com.au/apis/fast-payments/error-codes
  source: openapi/commonwealth-bank-fast-payments-api-openapi.yml, openapi/commonwealth-bank-payto-api-openapi.yml
pagination:
  style: page-number
  params:
  - page
  - page-size
  page_size_max: 1000
  response_links:
    self: true
    first: true
    prev: true
    next: true
    last: true
  response_meta:
  - totalRecords
  - totalPages
  envelope: Links (LinksPaginated) + Meta (MetaPaginated) alongside data
request_tracing:
  headers:
  - x-fapi-interaction-id
  - x-fapi-auth-date
  - x-fapi-customer-ip-address
  - x-cds-client-headers
  note: x-fapi-interaction-id is echoed on the response for correlation; the x-fapi-* headers are the CDR/FAPI request-context
    headers.
content_negotiation:
  accept: application/json
  note: CDR responses are application/json; there is no application/problem+json.
error_envelope:
  shape: '{ "errors": [ { "code": "<urn:au-cds:error:...>", "title": "...", "detail": "...", "meta": {} } ] }'
  format: cds-response-error-list
