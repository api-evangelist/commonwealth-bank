rate_limiting:
  signalled: true
  status: 429
  note: Endpoints return HTTP 429 when CDR traffic thresholds are exceeded; CDR defines tiered transaction thresholds
    per session/customer for Data Holders.
  status_code: 429
  documented_limits:
  - 'NameCheck: 5 transactions, or checks, per second (5 TPS)'
  headers: null
  retry_guidance: Implement retry and exponential backoff handling for temporary failures such as 429, 500, and
